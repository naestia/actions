# Reusable build/deploy workflow — the central "actions" collection Cent dispatches.
#
# Cent triggers this via the GitHub API (workflow_dispatch), passing the target
# app repo + commit and a correlation id. This workflow runs HERE, checks out the
# TARGET repo using a short-lived GitHub App token, builds/deploys it, and POSTs
# the result back to Cent.
#
# App repos need no workflow of their own — GitHub sends Cent the push webhook,
# Cent decides, Cent dispatches this. Add more workflows next to this one
# (deploy.yml, migrate.yml, …) for other actions Cent can dispatch.
#
# Repo secrets required:
#   APP_ID           — the GitHub App's id (same App Cent uses)
#   APP_PRIVATE_KEY  — the App's private key (PEM) — mints a token to check out the target
#   CENT_API_TOKEN   — must equal Cent's CENT_API_TOKEN (for the status callback)
#   GHCR_TOKEN       — a PAT with write:packages (pushes the image to GHCR)
#
# The GitHub App needs Contents: read (checkout) and to be installed on the target
# app repos. GHCR pushes use GHCR_TOKEN — neither App installation tokens nor
# GITHUB_TOKEN can reliably create a package in your namespace from another repo.
#
# Builds and pushes ghcr.io/<owner>/<name>:<version>. Optional `context` input
# (default ".") sets the Docker build context; a rule can override it per repo.

name: build
run-name: "build ${{ inputs.target_repo }}@${{ inputs.target_sha }} (dep ${{ inputs.cent_deployment_id }})"

on:
  workflow_dispatch:
    inputs:
      target_repo:        { description: "owner/repo to build", required: true }
      target_ref:         { description: "branch that was pushed", required: true }
      target_sha:         { description: "exact commit to check out", required: true }
      cent_deployment_id: { description: "Cent deployment id (correlation)", required: true }
      cent_callback_url:  { description: "where to POST status back", required: true }
      context:            { description: "Docker build context (default: repo root)", required: false, default: "." }
      default_branch:     { description: "the app's release/base branch for versioning", required: false, default: "master" }

# Checkout uses the App token; the GHCR push uses a PAT (GHCR_TOKEN). Neither the
# App installation token nor GITHUB_TOKEN can reliably create a package in your
# namespace from a different repo, so the default GITHUB_TOKEN isn't used.
permissions: {}

# Serialize deploys of the same target+ref; queue rather than cancel in-flight ones.
concurrency:
  group: build-${{ inputs.target_repo }}-${{ inputs.target_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Parse target owner/name
        id: t
        env:
          TARGET: ${{ inputs.target_repo }}
        run: |
          echo "owner=${TARGET%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${TARGET#*/}"   >> "$GITHUB_OUTPUT"
          # GHCR requires a lowercase image name.
          echo "image=$(echo "ghcr.io/$TARGET" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      # Mint an installation token scoped to just the target repo (needs the App
      # installed on it with contents:read).
      - name: Mint app token for the target repo
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.t.outputs.owner }}
          repositories: ${{ steps.t.outputs.name }}

      - name: Checkout the target app at the pushed commit
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          ref: ${{ inputs.target_sha }}
          token: ${{ steps.apptoken.outputs.token }}
          fetch-depth: 0   # need full history to reach master + count commits

      # Compute the build version/tag from the app's version file (package.json).
      #   develop   → RC: <default_branch>'s minor + 1, patch 0, -rc.N
      #               N = develop commits since it diverged from <default_branch>
      #               e.g. default_branch 1.1.0  →  1.2.0-rc.7
      #   otherwise → the version file as-is (a release build)
      # Assumes a Node app (package.json). The base branch is the `default_branch`
      # input (default "master"); adapt the parse for other stacks.
      - name: Compute version
        id: ver
        env:
          REF: ${{ inputs.target_ref }}
          DEFAULT_BRANCH: ${{ inputs.default_branch }}
        run: |
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if [ "$REF" = "develop" ]; then
            base=$(git show "origin/${DEFAULT_BRANCH}:package.json" | jq -r .version)   # e.g. 1.1.0
            IFS=. read -r major minor _ <<< "${base%%-*}"
            n=$(git rev-list --count "origin/${DEFAULT_BRANCH}..HEAD")                   # develop commits since ${DEFAULT_BRANCH}
            version="${major}.$((minor + 1)).0-rc.${n}"                                  # e.g. 1.2.0-rc.7
          else
            version=$(jq -r .version package.json)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Build version: $version"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}   # PAT with write:packages

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ steps.t.outputs.image }}:${{ steps.ver.outputs.version }}

      # Always tell Cent how it went (success or failure) so the Deployments log
      # + Services view reflect the real outcome.
      - name: Report status to Cent
        if: always()
        env:
          STATUS: ${{ job.status == 'success' && 'succeeded' || 'failed' }}
          CALLBACK: ${{ inputs.cent_callback_url }}
          TOKEN: ${{ secrets.CENT_API_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsS -X POST "$CALLBACK" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"status\":\"${STATUS}\",\"external_url\":\"${RUN_URL}\"}"
